<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi gratis | Ultra-Sport 19</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;700&family=Barlow+Condensed:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1d2f;color:#fff;font-family:Barlow,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 16px 28px;text-align:center;overflow-x:hidden}
.caiste{font-family:Anton,sans-serif;font-size:clamp(56px,17vw,96px);line-height:1.1;color:#E21C25;animation:temblor .5s ease-in-out 3,latido 1.6s ease-in-out 1.6s infinite;text-shadow:0 4px 20px rgba(226,28,37,.4)}
@keyframes temblor{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) scale(1.08)}75%{transform:rotate(6deg) scale(1.08)}}
@keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.lobo{width:100%;max-width:420px;max-height:52vh;object-fit:cover;object-position:50% 15%;border-radius:22px;margin:10px 0 16px;border:4px solid #E21C25;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:entra .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes entra{from{transform:scale(.6) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.t1{font-family:'Barlow Condensed',sans-serif;font-size:clamp(24px,7vw,34px);letter-spacing:1px;line-height:1.2}
.t1 s{color:#9fb3c8}
.t2{font-family:Anton,sans-serif;font-size:clamp(40px,12vw,64px);line-height:1.12;margin:8px 0 4px}
.t2 b{color:#E21C25;font-weight:400}
.t3{color:#D9E8F5;font-size:18px;margin-bottom:18px}
.boton{font-family:Anton,sans-serif;font-size:28px;letter-spacing:1px;background:#E21C25;color:#fff;border:0;border-radius:60px;padding:18px 34px;cursor:pointer;box-shadow:0 8px 0 #8f0f15;transition:transform .08s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.boton:active{transform:translateY(6px);box-shadow:0 2px 0 #8f0f15}
.barra{width:100%;max-width:420px;height:16px;background:#102A43;border-radius:10px;margin:18px 0 8px;overflow:hidden;border:2px solid #24476b}
.barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E21C25,#ff5a5f);transition:width .2s}
.cuenta{font-family:'Barlow Condensed',sans-serif;font-size:22px;color:#D9E8F5}
.fin{display:none;margin-top:16px;font-family:Anton,sans-serif;font-size:34px;line-height:1.15}
.fin small{display:block;font-family:Barlow,sans-serif;font-size:17px;color:#D9E8F5;margin-top:6px}
.pie{margin-top:auto;padding-top:26px;font-family:'Barlow Condensed',sans-serif;letter-spacing:3px;color:#9fb3c8;font-size:15px}
.chispa{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;pointer-events:none;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){.caiste,.lobo{animation:none}}
</style></head><body>
<div class="caiste">¡CAÍSTE!</div>
<img class="lobo" src="lobo.webp" alt="Lobo entrenador de Ultra-Sport 19 riéndose y apuntándote con un teléfono sin WiFi" width="880" height="1168">
<p class="t1">No hay <s>WiFi gratis</s>…</p>
<p class="t2">pero igual pagas<br><b>30 BURPEES</b> 😈</p>
<p class="t3"><b style="color:#fff">Se pagan al final de tu entrenamiento.</b><br>El entrenador está mirando 👀 Toca el botón por cada burpee.</p>
<button class="boton" id="b">+1 BURPEE</button>
<div class="barra"><i id="barra"></i></div>
<div class="cuenta" id="c">0 de 30</div>
<div class="fin" id="fin">¡DEUDA PAGADA! 🐺🔥<small>Igual no hay WiFi. Pero terminaste tu entrenamiento más fuerte.</small></div>
<div class="pie">ULTRA-SPORT 19 / PENCAHUE</div>
<script>
var n=0,b=document.getElementById('b');
b.onclick=function(){
  if(n>=30)return; n++;
  document.getElementById('barra').style.width=(n/30*100)+'%';
  document.getElementById('c').textContent=n+' de 30';
  if(navigator.vibrate)navigator.vibrate(30);
  if(n===30){b.textContent='¡LISTO!';document.getElementById('fin').style.display='block';chispas();}
};
function chispas(){var c=['#E21C25','#fff','#D9E8F5','#102A43'];for(var i=0;i<70;i++){var s=document.createElement('i');s.className='chispa';s.style.left=Math.random()*100+'vw';s.style.background=c[i%4];s.style.animationDuration=(1.6+Math.random()*1.8)+'s';s.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(s);}}
</script>
</body></html>
